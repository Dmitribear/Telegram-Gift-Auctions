services:
  mongodb:
    image: mongo:6.0
    container_name: auction_mongo
    ports:
      - "27018:27017"
    # Запускаем с настройкой реплика-сета
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo "try { rs.initiate() } catch (e) { rs.status() }" | mongosh --port 27017 --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  # Redis тоже нужен по заданию, добавим сразу
  redis:
    image: redis:alpine
    container_name: auction_redis
    ports:
      - "6380:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auction_backend
    environment:
      - PORT=3000
      - MONGO_URL=mongodb://mongodb:27017/auction_db?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - ADMIN_TOKEN=admin
    ports:
      - "3001:3000"
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE=http://localhost:3001
    container_name: auction_frontend
    ports:
      - "4174:4173"
    depends_on:
      - backend

volumes:
  mongo_data: